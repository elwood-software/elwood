<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elwood React</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import "@elwood/ui/style.css";
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { useMedia } from "react-use";

      import * as Elwood from "./src/index.ts";

      const mq = window.matchMedia("(prefers-color-scheme: dark)");

      mq.addEventListener("change", () => {
        document.querySelector("html").classList.remove("dark");
        mq.matches && document.querySelector("html").classList.add("dark");
      });

      mq.matches && document.querySelector("html").classList.add("dark");

      createRoot(document.getElementById("root")).render(
        React.createElement(Elwood.Provider, null, [
          React.createElement(Elwood.BrowserRouter, { key: "browser-router" }),
        ]),
      );
    </script>
  </body>
</html>
